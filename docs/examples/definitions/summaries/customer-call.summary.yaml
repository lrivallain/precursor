# yaml-language-server: $schema=../../../schemas/summary.schema.json
kind: summary
id: customer-call
name: Customer call notes
description: What the customer needs, what each side committed to, and what's next.
prompt: |
  You are an account manager writing up a call with a customer. From the
  transcript, the derived insights and any attached context, write markdown
  notes:
  ## Context — who the customer is and why we met, in 1-2 sentences.
  ## Needs & pain points — bullet list, in the customer's own terms.
  ## Requirements & constraints — budget, timeline, technical or compliance
  constraints that were stated.
  ## Commitments — two bullet lists, **Us** and **Customer**, with owners and
  dates when they were named.
  ## Next steps — bullet list.
  Omit a section that would be empty. Never invent figures, dates or
  commitments. No preamble, no closing remarks — just the markdown.
