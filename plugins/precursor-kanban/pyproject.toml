[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "precursor-kanban"
# Versioned from the host's git tags, exactly like `precursor-ai` — see
# [tool.hatch.version] at the bottom of this file for why.
dynamic = ["version"]
description = "GitHub Projects v2 kanban board for Precursor."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Precursor contributors" }]
keywords = ["precursor", "plugin", "github", "projects", "kanban"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# The host is a peer, not a vendored dependency: the plugin is only ever loaded
# *by* Precursor, and pinning it here would make `precursor-ai[kanban]` a
# circular requirement. `precursor.plugin_api` is the surface it targets.
dependencies = ["fastapi>=0.138", "pydantic>=2.13", "mcp>=1.28"]

[project.entry-points."precursor.plugins"]
kanban = "precursor_kanban.plugin:register"

[project.urls]
Homepage = "https://github.com/lrivallain/precursor"
Repository = "https://github.com/lrivallain/precursor"
Issues = "https://github.com/lrivallain/precursor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/precursor_kanban"]

# The built frontend (web/vite.config.ts -> src/precursor_kanban/web) is a build
# product and gitignored, so it must be declared as an artifact to ride along in
# the sdist; `uv build` builds the wheel *from* the sdist. Precursor serves it at
# /api/plugins/kanban/assets/*.
[tool.hatch.build]
artifacts = ["src/precursor_kanban/web/**"]

# Keep the frontend *sources* out of the distribution — only the built bundle
# ships.
[tool.hatch.build.targets.sdist]
exclude = ["web/node_modules", "web/dist"]

# CalVer inherited from the host's git tags, so a built-in plugin always ships a
# version that moves with the commit it was built from.
#
# The static `0.1.0` this replaces looked harmless and silently broke updates:
# the nightly manifest advertised `precursor_kanban-0.1.0-…whl` at a fixed URL
# on a reused tag, so every build produced a byte-identical requirement. uv saw
# `precursor-kanban==0.1.0` already installed, satisfied, and skipped the
# download — leaving a current host paired with a frozen plugin, which is the
# exact pairing RELEASING.md promises never happens. Publishing was impossible
# for the same reason: PyPI rejects re-uploading a version.
#
# `root` is the only line tying this to the monorepo. Extracting the plugin to
# its own repository means dropping it (and tagging there instead); everything
# else here already stands alone.
[tool.hatch.version]
source = "vcs"
raw-options = { root = "../..", version_scheme = "guess-next-dev", local_scheme = "node-and-date", fallback_version = "0.0.0" }
