[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
# Distribution name published to PyPI. The plain `precursor` name is already
# taken on PyPI, so the distribution is `precursor-ai`. It ships a matching
# `precursor-ai` command (so `uvx precursor-ai` needs no `--from`) plus a
# `precursor` alias; the import package stays `precursor`.
name = "precursor-ai"
# Version is CalVer (YYYY.M.MICRO), derived from the latest git tag (v<version>)
# by hatch-vcs — see [tool.hatch.version]. Tag a release with e.g. `v2026.6.0`.
dynamic = ["version"]
description = "Per-topic AI chat interface for work follow-up, where each topic maps to a GitHub issue."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Precursor contributors" }]
keywords = ["chat", "github", "copilot", "mcp", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# Floors are intentionally coarse (major.minor, no patch pin): they state the
# minimum API we rely on, not "the latest at the time of writing". uv.lock pins
# exact versions for reproducible dev/CI installs, so the floors don't need to
# chase every release — see dependabot.yml (`increase-if-necessary`) which keeps
# routine minor/patch bumps out of the manifest.
dependencies = [
    "fastapi>=0.138",
    "uvicorn[standard]>=0.49",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.22",
    "alembic>=1.18",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "sse-starlette>=3.4",
    "httpx>=0.28",
    "openai>=2.43",
    # Capped below 2.0: that release renamed the client entry points we import
    # (``streamablehttp_client`` → ``streamable_http_client``) and dropped the
    # old names, so an uncapped floor resolves a wheel the app cannot import.
    # uv.lock protects dev and CI, but *end users of the published wheel*
    # resolve fresh — so an API-breaking major needs a real cap here.
    "mcp>=1.28,<2",
    # Agents mode. The floor is *not* the usual "minimum API we rely on": 1.0.4
    # is where the SDK stopped shipping six platform-specific wheels that each
    # bundled the native Copilot CLI (~95 MB, ~145 MB unpacked) and became a
    # single ~0.5 MB `py3-none-any` wheel that downloads the CLI on demand. Only
    # that shape is defensible in a default install — resolving 1.0.2 here would
    # put ~150 MB in every one. The payload is still opt-in, just one step later:
    # Settings → Agents provisions the CLI on an explicit click.
    #
    # Capped at <2 for the same reason as `mcp`: Precursor reaches into the SDK's
    # private CLI-resolution and download helpers, so an uncapped floor let a
    # *patch* release move a symbol out from under the runtime probe. The probe
    # degrades to `COPILOT_CLI_PATH` / `PATH` when those internals move, and the
    # cap bounds the blast radius of a major rewrite of the public client API.
    "github-copilot-sdk>=1.0.4,<2",
    "python-multipart>=0.0.32",
    "pypdf>=6.13",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.31"]
# Deprecated, kept deliberately empty. Agents mode used to live behind this
# extra; the Copilot SDK is now a normal dependency (see above), so there is
# nothing left to opt into. The name stays because removing it would break every
# install that still names it — a habitual `uv sync --extra agents`, and above
# all the requirement `precursor service update` rebuilds from uv's install
# receipt, which faithfully reproduces `precursor-ai[kanban,tray,agents]` for
# anyone who installed the extra before this change.
agents = []
# The kanban board (GitHub Projects v2) ships as the first official plugin — a
# separate distribution under plugins/precursor-kanban with its own routes,
# schemas and release cadence. It stays in the default install via this extra so
# `pip install precursor-ai[kanban]` (or the dev workspace) keeps the section,
# while `pip install precursor-ai` gets a core with no GitHub Projects surface.
kanban = ["precursor-kanban>=0.1"]
# Menu-bar / system-tray control for a background instance (`precursor tray`).
# An extra because pystray + Pillow pull GUI bindings that a headless or
# server-side install has no use for; the `precursor service …` commands cover
# the same ground without them.
tray = ["pystray>=0.19", "pillow>=11.0"]

# Dev tooling lives in a PEP 735 dependency group rather than an extra, so uv
# includes it by DEFAULT on every `uv run` / `uv sync` (no `--extra dev` to
# remember, and a bare `uv run <cmd>` never prunes ruff/pytest/mypy). Dependency
# groups are dev-only — they are not part of the published wheel's requirements,
# so `pip install precursor-ai` is unaffected.
[dependency-groups]
dev = [
    # In-repo plugins, installed editable so the host resolves their entry points
    # during development and CI (mirrors `precursor-ai[kanban]` for end users).
    "precursor-kanban",
    "ruff>=0.15",
    "mypy>=2.1",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "httpx>=0.28",
    "types-PyYAML>=6.0",
]

[project.scripts]
# The distribution is `precursor-ai`, so expose a matching `precursor-ai`
# command — that lets `uvx precursor-ai` work without `--from`. `precursor`
# stays as a shorter alias (used throughout the dev docs and the Makefile).
precursor-ai = "precursor.backend.__main__:main"
precursor = "precursor.backend.__main__:main"

# Plugin discovery — third-party packages register entry points under this group.
# A plugin module must expose a `register(registry)` callable.
[project.entry-points."precursor.plugins"]
# Core registers no plugins itself; the group exists so third-party (and our
# own, e.g. precursor-kanban) distributions can hook in. See docs/plugins.md.

[project.urls]
Homepage = "https://github.com/lrivallain/precursor"
Repository = "https://github.com/lrivallain/precursor"
Issues = "https://github.com/lrivallain/precursor/issues"
Changelog = "https://github.com/lrivallain/precursor/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["precursor"]

# In-repo plugins are separate distributions resolved from the working tree, so
# `uv sync` installs them editable alongside the host and `make check` type-checks
# and tests them against the live plugin API.
[tool.uv.sources]
precursor-kanban = { workspace = true }

[tool.uv.workspace]
members = ["plugins/*"]

# The built SPA (frontend/dist) is bundled inside the package as
# precursor/frontend_dist so an installed wheel is self-contained — `uvx
# precursor-ai` / `uv tool install precursor-ai` then serve the UI with no extra
# files. This is done by a *conditional* build hook (hatch_build.py) rather than
# a static force-include: editable installs (`uv sync`, dev, CI) don't build the
# frontend, and a static force-include would fail on the missing directory. The
# hook only bundles for non-editable wheels when frontend/dist exists; at
# runtime the source tree's frontend/dist is the fallback.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# frontend/dist and website/.vitepress/dist are gitignored (build products), so
# they're excluded from the sdist by default. `uv build` builds the wheel *from
# the sdist*, so both must ride along in the sdist. `artifacts` overrides
# gitignore; the sdist force-include is only consulted when a build is present
# (release builds).
[tool.hatch.build]
artifacts = ["frontend/dist/**", "website/.vitepress/dist/**"]

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

# CalVer version derived from git tags (tag a release `v2026.6.0`). Untagged
# dev builds get e.g. `2026.6.1.devN+g<sha>.dYYYYMMDD`. The fallback keeps
# builds working in a shallow checkout with no tags/history.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
fallback_version = "0.0.0"

# Write the resolved version into the package so installed wheels report it
# without needing git. Ignored by git (regenerated at build time).
[tool.hatch.build.hooks.vcs]
version-file = "precursor/_version.py"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# E501: line length handled by the formatter.
# B008: FastAPI's `Depends()` / `Query()` defaults are the framework idiom.
ignore = ["E501", "B008"]

# In-repo plugins live under their own src roots, so ruff can't infer that they
# are ours. Naming them keeps host and plugin imports in one first-party block.
[tool.ruff.lint.isort]
known-first-party = ["precursor", "precursor_kanban"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["frontend/", "precursor/backend/alembic/versions/"]
# In-repo plugins live under a src layout, so point mypy at their source roots.
mypy_path = "plugins/precursor-kanban/src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Core suite plus every in-repo plugin's own tests, so `make test` covers both.
testpaths = ["tests", "plugins/precursor-kanban/tests"]
