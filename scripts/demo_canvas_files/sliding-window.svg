<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" font-family="system-ui, sans-serif" font-size="12" fill="currentColor">
  <text x="20" y="22" font-size="14" font-weight="600">Sender's sliding window (cwnd = 5)</text>
  <g stroke="currentColor" stroke-opacity="0.5">
    <rect x="20" y="50" width="40" height="40" fill="#22c55e" fill-opacity="0.35"/>
    <rect x="60" y="50" width="40" height="40" fill="#22c55e" fill-opacity="0.35"/>
    <rect x="100" y="50" width="40" height="40" fill="#22c55e" fill-opacity="0.35"/>
    <rect x="140" y="50" width="40" height="40" fill="#3b82f6" fill-opacity="0.35"/>
    <rect x="180" y="50" width="40" height="40" fill="#3b82f6" fill-opacity="0.35"/>
    <rect x="220" y="50" width="40" height="40" fill="#3b82f6" fill-opacity="0.35"/>
    <rect x="260" y="50" width="40" height="40" fill="#a3a3a3" fill-opacity="0.2"/>
    <rect x="300" y="50" width="40" height="40" fill="#a3a3a3" fill-opacity="0.2"/>
    <rect x="340" y="50" width="40" height="40" fill="none"/>
    <rect x="380" y="50" width="40" height="40" fill="none"/>
    <rect x="420" y="50" width="40" height="40" fill="none"/>
    <rect x="460" y="50" width="40" height="40" fill="none"/>
  </g>
  <g text-anchor="middle">
    <text x="40" y="75">1</text><text x="80" y="75">2</text><text x="120" y="75">3</text>
    <text x="160" y="75">4</text><text x="200" y="75">5</text><text x="240" y="75">6</text>
    <text x="280" y="75">7</text><text x="320" y="75">8</text><text x="360" y="75">9</text>
    <text x="400" y="75">10</text><text x="440" y="75">11</text><text x="480" y="75">12</text>
  </g>
  <rect x="138" y="44" width="204" height="52" rx="6" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="240" y="114" text-anchor="middle" fill="#f59e0b">window: may be in flight</text>
  <g font-size="11" fill-opacity="0.85">
    <rect x="20" y="136" width="12" height="12" fill="#22c55e" fill-opacity="0.5"/><text x="38" y="146">acknowledged</text>
    <rect x="140" y="136" width="12" height="12" fill="#3b82f6" fill-opacity="0.5"/><text x="158" y="146">sent, not acked</text>
    <rect x="270" y="136" width="12" height="12" fill="#a3a3a3" fill-opacity="0.4"/><text x="288" y="146">can send now</text>
    <rect x="390" y="136" width="12" height="12" fill="none" stroke="currentColor"/><text x="408" y="146">must wait</text>
  </g>
</svg>
