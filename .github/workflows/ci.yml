name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lockfiles:
    name: Lockfiles (public pins · strong hashes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Stdlib-only, so no dependency install is needed to police dependencies.
      - name: Check lockfiles
        run: python3 scripts/check_lockfiles.py

  backend:
    name: Backend (lint · types · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so hatch-vcs can resolve the CalVer version.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # `--locked` fails instead of silently re-resolving, so a stale or
      # locally-rewritten uv.lock surfaces here rather than in a release.
      - name: Sync dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy precursor

      - name: Pytest
        run: uv run pytest -q

  # Nobody on the team runs Windows day to day, so this job is how Windows users
  # get the same app: the suite exercises every platform branch it can reach
  # there (paths, sockets, subprocesses, the login item) rather than trusting
  # `# pragma: no cover - Windows-only path` to mean "works".
  backend-windows:
    name: Backend on Windows (tests)
    runs-on: windows-latest
    steps:
      # Runners default to autocrlf=true, which would hand tests CRLF fixtures
      # that no user's installed wheel ever contains.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # With the tray extra, so the icon's Windows paths import for real.
      - name: Sync dependencies
        run: uv sync --locked --extra tray

      - name: Pytest
        run: uv run pytest -q -p no:cacheprovider

  # Deliberately *not* the lockfile. End users install the published wheel and
  # resolve every dependency fresh, which is how 2026.9.1 met an MCP major the
  # locked suite had never seen. This builds the wheel the release would ship,
  # installs it into an empty environment outside the checkout, and runs the
  # unchanged release smoke gate plus the MCP surfaces the app never imports.
  wheel:
    name: Fresh wheel install (resolved, not locked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so hatch-vcs can resolve the CalVer version.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            website/package-lock.json

      # The smoke gate requires the bundled SPA and docs, as in release.yml.
      - name: Build frontend and bundled documentation
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          npm --prefix website ci
          DOCS_BASE=/docs/ npm --prefix website run docs:build

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build the wheel
        run: uv build --no-create-gitignore

      # The Windows install job installs this very wheel rather than rebuilding
      # the SPA and docs on a slower runner.
      - name: Share the wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 3

      # With the kanban extra: the plugin's MCP server runs in this same
      # environment, so a plugin on another SDK major is exactly the failure a
      # fresh install has to catch.
      - name: Install it into a fresh environment
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl)"
          uv venv --python 3.12 "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" "precursor-ai[kanban] @ ./$wheel"
          uv pip check --python "$RUNNER_TEMP/wheel-venv/bin/python"
          uv pip list --python "$RUNNER_TEMP/wheel-venv/bin/python" | grep -E '^(mcp|httpx2|precursor-kanban) '

      - name: Release smoke gate
        run: |
          set -euo pipefail
          python="$RUNNER_TEMP/wheel-venv/bin/python"
          version="$("$python" -I -c 'import importlib.metadata as m; print(m.version("precursor-ai"))')"
          "$python" -I scripts/smoke_release.py "$version"

      - name: MCP smoke (stdio servers, streamable HTTP, plugin servers)
        run: '"$RUNNER_TEMP/wheel-venv/bin/python" -I scripts/smoke_mcp.py kanban'

  # The whole Windows user journey, end to end, on the wheel built above: the
  # PowerShell installer as a user runs it, the login item it registers, the
  # service lifecycle (including a *graceful* stop), and a self-update — which
  # on Windows has to finish in a helper, because nothing may run from the tool
  # environment while uv replaces it.
  install-windows:
    name: Install on Windows (install.ps1 · service · update)
    needs: wheel
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: wheel
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Windows PowerShell 5.1 and `irm | iex`: the least capable shell a user
      # may paste the one-liner into, run exactly the way the docs say.
      - name: Install with install.ps1
        shell: powershell
        run: |
          $env:PRECURSOR_WHEEL = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          Get-Content -Raw scripts\install.ps1 | Invoke-Expression

      - name: Drive the installed app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          function Say([string]$m) { Write-Host "::group::$m" }
          function Done { Write-Host '::endgroup::' }
          $bin = (uv tool dir --bin).Trim()
          $precursor = Join-Path $bin 'precursor.exe'
          $data = Join-Path $env:APPDATA 'Precursor'
          function Status { (& $precursor service status --json 2>$null | Out-String | ConvertFrom-Json) }
          function Wait-Running([int]$seconds = 90) {
            $deadline = (Get-Date).AddSeconds($seconds)
            while ((Get-Date) -lt $deadline) {
              $PSNativeCommandUseErrorActionPreference = $false
              $s = Status
              if ($s.running) { return $s }
              Start-Sleep -Milliseconds 500
            }
            throw "Precursor did not come up within $seconds s"
          }

          Say 'The installer left it running'
          $status = Wait-Running
          $health = Invoke-RestMethod "$($status.instance.url)api/health"
          $health | ConvertTo-Json -Compress
          Done

          Say 'The login items run pythonw, never a console'
          $run = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $run.Precursor
          if ($run.Precursor -notmatch 'pythonw\.exe" -m precursor\.backend service start$') { throw 'unexpected app entry' }
          if ($run.'Precursor Tray' -notmatch 'pythonw\.exe" -m precursor\.backend tray$') { throw 'unexpected tray entry' }
          $startup = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Startup\precursor.cmd'
          if (Test-Path $startup) { throw 'the legacy Startup script is still there' }
          $visible = Get-Process python*, pythonw* -ErrorAction SilentlyContinue | Where-Object MainWindowHandle -ne 0
          if ($visible) { $visible | Format-Table Id, ProcessName, MainWindowTitle; throw 'a Precursor process owns a visible window' }
          Done

          Say 'Stopping is graceful (Ctrl+Break), not a 20 s wait for taskkill /F'
          $watch = [Diagnostics.Stopwatch]::StartNew()
          & $precursor service stop
          $watch.Stop()
          "stopped in $($watch.Elapsed.TotalSeconds) s"
          if ($watch.Elapsed.TotalSeconds -ge 15) { throw 'stop fell through to the hard kill' }
          $log = Get-Content (Join-Path $data 'logs\precursor.log') -Raw
          if ($log -notmatch 'Application shutdown complete') { throw 'uvicorn never ran its shutdown' }
          Done

          Say 'What the Run entry does at login brings it back'
          if ($run.Precursor -notmatch '^"(?<exe>[^"]+)" (?<rest>.+)$') { throw 'unparseable entry' }
          Start-Process -FilePath $Matches.exe -ArgumentList $Matches.rest
          $status = Wait-Running
          Invoke-RestMethod "$($status.instance.url)api/health" | Out-Null
          Done

          Say 'restart, logs and data-dir'
          & $precursor service restart
          Wait-Running | Out-Null
          & $precursor service logs -n 5
          & $precursor service data-dir
          Done

          Say 'A self-update finishes in a helper and brings the app back'
          $python = Join-Path (uv tool dir).Trim() 'precursor-ai\Scripts\python.exe'
          $wheel = ([System.Uri](Get-ChildItem dist\*.whl | Select-Object -First 1).FullName).AbsoluteUri
          $before = (Status).instance.pid
          & $python -c "from dataclasses import replace; from precursor.backend.services import updates; info = replace(updates.check(force=True), channel='nightly', wheel_url='$wheel', extra_wheel_urls=(), latest_version='ci', update_available=True, error=None); assert updates.applies_out_of_process(info); print(updates.apply(info))"
          $updateLog = Join-Path $data 'logs\update.log'
          $deadline = (Get-Date).AddMinutes(8)
          while ((Get-Date) -lt $deadline) {
            if ((Test-Path $updateLog) -and ((Get-Content $updateLog -Raw) -match 'Starting Precursor')) { break }
            Start-Sleep -Seconds 2
          }
          Get-Content $updateLog
          if ((Get-Content $updateLog -Raw) -notmatch 'Update installed\.') { throw 'the update did not install' }
          $status = Wait-Running 120
          if ($status.instance.pid -eq $before) { throw 'the instance was never restarted' }
          Invoke-RestMethod "$($status.instance.url)api/health" | Out-Null
          Done

          Say 'Uninstall stops it and removes the entries'
          & $precursor service uninstall
          $run = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          if ($run.PSObject.Properties['Precursor']) { throw 'the app entry survived uninstall' }
          $PSNativeCommandUseErrorActionPreference = $false
          if ((Status).running) { throw 'still running after uninstall' }
          uv tool uninstall precursor-ai
          if ($LASTEXITCODE -ne 0) { throw 'uv tool uninstall failed - something still holds the environment' }
          Done

      - name: Logs
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem "$env:APPDATA\Precursor\logs" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "::group::$($_.Name)"; Get-Content $_.FullName -Tail 80; Write-Host '::endgroup::' }

  frontend:
    name: Frontend (typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  docs:
    name: Docs site (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `pages.yml` only builds on main, so without this a broken docs build
      # would surface at deploy time. It also gives docs changes a verification
      # path on machines that can't reach every package from a corporate mirror.
      - name: Build
        run: npm run docs:build
