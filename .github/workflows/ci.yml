name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lockfiles:
    name: Lockfiles (public pins · strong hashes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Stdlib-only, so no dependency install is needed to police dependencies.
      - name: Check lockfiles
        run: python3 scripts/check_lockfiles.py

  backend:
    name: Backend (lint · types · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so hatch-vcs can resolve the CalVer version.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # `--locked` fails instead of silently re-resolving, so a stale or
      # locally-rewritten uv.lock surfaces here rather than in a release.
      - name: Sync dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy precursor plugins/precursor-kanban/src

      - name: Pytest
        run: uv run pytest -q

  frontend:
    name: Frontend (typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  docs:
    name: Docs site (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `pages.yml` only builds on main, so without this a broken docs build
      # would surface at deploy time. It also gives docs changes a verification
      # path on machines that can't reach every package from a corporate mirror.
      - name: Build
        run: npm run docs:build
