name: Agent · review

# Advisory cross-vendor review (ADR-0001, P1). PRs from claude/* branches are
# reviewed by Copilot code review (enabled in the repository rules, reading
# .github/skills/review); every other same-repo PR gets this review.
# GitHub only: GitHub Models, called with this job's GITHUB_TOKEN (models: read),
# no secret. The model has no tools: it gets the diff as data and answers in
# JSON; the apply job posts one comment, updated on each push.
# Pause with AGENTS_PAUSED=true; pick the model with AGENT_MODEL.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review (read-only, GitHub Models)
    # Fork and Dependabot PRs get a token without models access; Claude-authored
    # PRs go to Copilot so the reviewer is never the author's vendor.
    if: >-
      vars.AGENTS_PAUSED != 'true' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'claude/') &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: read
      models: read
    outputs:
      result: ${{ steps.infer.outputs.result }}
    steps:
      # Base branch: the review rules and the script never come from the PR,
      # so a PR cannot soften its own review. The diff is read through the API.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - id: infer
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          PR: ${{ github.event.pull_request.number }}
        run: >-
          python3 scripts/agent_infer.py review --repo "$GITHUB_REPOSITORY"
          --number "$PR" --skill .github/skills/review/SKILL.md

  apply:
    name: Post the review comment
    needs: review
    if: needs.review.outputs.result != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          AGENT_OUTPUT: ${{ needs.review.outputs.result }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 scripts/agent_apply.py review --repo "$GITHUB_REPOSITORY" --number "$PR"
