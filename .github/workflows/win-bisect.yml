name: Windows bisect (temporary)

on:
  pull_request:

jobs:
  bisect:
    name: bisect ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: isolated
            files: ""
          - name: autostart
            files: tests/test_autostart.py
          - name: stdio
            files: tests/test_launcher_stdio.py
          - name: misc
            files: tests/test_launcher_ports.py tests/test_desktop_reveal.py tests/test_frontend_build.py tests/test_github_cli_user.py
          - name: agents
            files: tests/test_agent365.py tests/test_agent_event_recap.py tests/test_agent_event_retention.py tests/test_agent_schedules.py tests/test_agent_state.py tests/test_agents.py tests/test_agents_auth_surface.py tests/test_agents_leaf_modules.py tests/test_agents_provision.py tests/test_agents_runtime.py
          - name: app-to-issue
            files: tests/test_app.py tests/test_backup.py tests/test_banner.py tests/test_chat_autoname.py tests/test_chat_description_prompt.py tests/test_chat_retry.py tests/test_chat_tool_result.py tests/test_check_lockfiles.py tests/test_cmd_runner.py tests/test_collections.py tests/test_conversation_turn.py tests/test_copilot_endpoints.py tests/test_data_dir_resolution.py tests/test_docs_serving.py tests/test_drawio_assets.py tests/test_drawio_mcp.py tests/test_event_relay.py tests/test_fetch_mcp.py tests/test_github_graphql.py tests/test_issue_detail.py
          - name: live-to-pool
            files: tests/test_live_sessions.py tests/test_live_transcript_retention.py tests/test_logging_config.py tests/test_mcp_auth_pause.py tests/test_mcp_auth_resolved_event.py tests/test_mcp_deferred_auth.py tests/test_mcp_deferred_auth_sse.py tests/test_mcp_deferred_status.py tests/test_mcp_pool.py
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --extra tray
      - run: uv run pytest -q -p no:cacheprovider ${{ matrix.files }} tests/test_mcp_sdk_v2.py tests/test_workspace_chat_stream.py
