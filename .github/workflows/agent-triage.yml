name: Agent · triage

# Proposes labels and asks clarifying questions on new issues (ADR-0001, P1).
# GitHub only: GitHub Models, called with this job's GITHUB_TOKEN (models: read),
# no secret. The model has no tools and answers in JSON; the apply job is the
# only one with a write token and accepts allowlisted labels only.
# Pause every agent with the repository variable AGENTS_PAUSED=true; pick the
# model with AGENT_MODEL (default openai/gpt-4.1).

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to (re)triage
        required: true
        type: number

permissions: {}

concurrency:
  group: agent-triage-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: true

jobs:
  triage:
    name: Triage (read-only, GitHub Models)
    # A comment re-runs triage only when the author answers a needs-info question.
    if: >-
      vars.AGENTS_PAUSED != 'true' && (
        github.event_name != 'issue_comment' || (
          !github.event.issue.pull_request &&
          contains(github.event.issue.labels.*.name, 'status:needs-info') &&
          github.event.comment.user.login == github.event.issue.user.login))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      issues: read
      models: read
    outputs:
      result: ${{ steps.infer.outputs.result }}
    steps:
      # Default branch: the skill and the script come from main, never from the issue.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: infer
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: >-
          python3 scripts/agent_infer.py triage --repo "$GITHUB_REPOSITORY"
          --number "$ISSUE" --skill .github/skills/triage/SKILL.md

  apply:
    name: Apply labels and comment
    needs: triage
    if: needs.triage.outputs.result != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          AGENT_OUTPUT: ${{ needs.triage.outputs.result }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: python3 scripts/agent_apply.py triage --repo "$GITHUB_REPOSITORY" --number "$ISSUE"
