name: Nightly

# Publish a rolling build of `main` so an installed Precursor can track the
# development line without a source checkout — no `git pull`, no Node.js, no
# frontend build on the user's machine.
#
# The artifacts land on a single, permanently-named `nightly` prerelease that is
# replaced after successful CI on main. Alongside the wheel it carries a tiny
# `version.json` manifest the app reads to answer "is there something newer than me?" in one
# request (see precursor/backend/services/updates.py).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  gate:
    name: Require CI on the exact current main commit
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Require successful main-push CI and reject superseded commits
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python3 scripts/release.py nightly --sha "$TESTED_SHA"

  nightly:
    name: Build and publish the rolling build
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Never cancel halfway through replacing the release. Queued runs recheck
    # main and CI before touching it, so late completions cannot roll it back.
    concurrency:
      group: nightly
      cancel-in-progress: false
    permissions:
      actions: read # recheck the same commit's CI immediately before publishing
      contents: write # replace the `nightly` release and its assets
    env:
      TESTED_SHA: ${{ needs.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          # Full history + tags so hatch-vcs derives a dev version that encodes
          # the commit (…dev227+g<sha>), which is what the update check compares.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (bundled into the wheel)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build wheel + sdist
        run: uv build

      - name: Write the version manifest
        id: manifest
        run: |
          set -euo pipefail
          # Built entirely in Python, passed the wheel list as argv: no shell
          # quoting boundary to get wrong, and the output is valid JSON by
          # construction rather than by a heredoc's good behaviour. Every client
          # parses this file, so a filename needing escaping must not corrupt it.
          python3 - dist/*.whl <<'PY' > dist/version.json
          import datetime, json, os, pathlib, sys

          wheels = [pathlib.Path(w) for w in sys.argv[1:]]
          hosts = [w for w in wheels if w.name.startswith("precursor_ai-")]
          # Exactly one is expected: fresh checkout, fresh build. Assert it
          # rather than picking the first of several, which would publish a
          # manifest pointing at the wrong build.
          if len(hosts) != 1:
              sys.exit(f"Expected exactly 1 host wheel, found {len(hosts)}: {[w.name for w in hosts]}")
          host = hosts[0]

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["TESTED_SHA"]
          base = f"https://github.com/{repo}/releases/download/nightly"

          json.dump(
              {
                  "channel": "nightly",
                  # e.g. precursor_ai-2026.7.1.dev229+g679a4fe6e-py3-none-any.whl
                  "version": host.name.split("-")[1],
                  "commit": sha[:9],
                  "full_commit": sha,
                  "built_at": datetime.datetime.now(datetime.timezone.utc).strftime(
                      "%Y-%m-%dT%H:%M:%SZ"
                  ),
                  "wheel_url": f"{base}/{host.name}",
                  # Any wheel built alongside the host rides along, so a nightly
                  # install gets same-commit companions rather than whatever is
                  # on PyPI (see `--with` in services/updates.py). This repo
                  # builds only the host today — plugins release from their own
                  # repositories — so the list is normally empty.
                  "extra_wheel_urls": [f"{base}/{w.name}" for w in wheels if w != host],
              },
              sys.stdout,
              indent=2,
          )
          PY
          cat dist/version.json
          version=$(python3 -c "import json;print(json.load(open('dist/version.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Recheck CI and supersession before publishing
        id: recheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py nightly --sha "$TESTED_SHA"

      - name: Replace the nightly release
        if: steps.recheck.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail
          # Written to a file rather than passed inline: the notes contain
          # backticks and fenced blocks, which are a shell-quoting minefield.
          cat > notes.md <<EOF
          Rolling build of \`main\` (${TESTED_SHA:0:9}).

          > [!WARNING]
          > This is an unstable prerelease rebuilt after successful CI on main. Use a tagged
          > release if you want stability.

          Install (or update) in one command:

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install.sh | sh
          \`\`\`

          An existing install updates itself with \`precursor service update\`.
          EOF
          # Recreate the release rather than editing it, so no stale wheel from
          # a previous run is left behind for a client to resolve. Every release
          # on the tag goes, drafts included: a draft is invisible to the tag
          # lookup `gh release delete` would start from.
          releases="repos/$GITHUB_REPOSITORY/releases"
          for id in $(gh api --paginate "$releases?per_page=100" \
              -q '.[] | select(.tag_name == "nightly") | .id'); do
            gh api -X DELETE "$releases/$id" --silent
          done
          # Move the tag instead of deleting it. GitHub turns the releases of a
          # deleted tag into drafts asynchronously, so deleting and recreating
          # it seconds apart could draft the release just published, leaving
          # every nightly URL a 404 behind a green run.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" --silent 2>/dev/null; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" \
              -f sha="$TESTED_SHA" -F force=true --silent
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/tags/nightly -f sha="$TESTED_SHA" --silent
          fi
          gh release create nightly \
            --title "Nightly ($VERSION)" \
            --notes-file notes.md \
            --prerelease \
            --verify-tag \
            dist/*.whl dist/*.tar.gz dist/version.json

      - name: Check the nightly is downloadable
        if: steps.recheck.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/nightly"
          # Anonymous, like every client, and only this build counts: a
          # published release still serving the previous manifest is as broken
          # for an installer as a 404.
          serves_this_build() {
            local manifest
            manifest=$(curl -fsSL "$base/version.json") || return 1
            [ "$(jq -r .full_commit <<<"$manifest")" = "$TESTED_SHA" ] || return 1
            curl -fsSL -o /dev/null "$(jq -r .wheel_url <<<"$manifest")"
          }
          wait_for_downloads() {
            # Downloads lag a publish by a few seconds.
            for _ in 1 2 3 4 5 6; do
              serves_this_build && return 0
              sleep 10
            done
            return 1
          }
          wait_for_downloads && exit 0
          # A draft carrying this build means publishing lost a race after all;
          # finishing that publish is exactly what `gh release create` meant to do.
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            -q '.[] | select(.tag_name == "nightly" and .draft) | .id' | sed -n 1p)
          if [ -n "$id" ]; then
            echo "::warning::The nightly release was left as a draft; publishing it."
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
              -F draft=false -f tag_name=nightly --silent
            wait_for_downloads && exit 0
          fi
          echo "::error::$base/version.json does not serve this build ($TESTED_SHA)."
          exit 1
