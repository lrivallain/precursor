name: Nightly

# Publish a rolling build of `main` so an installed Precursor can track the
# development line without a source checkout — no `git pull`, no Node.js, no
# plugin frontend build on the user's machine.
#
# The artifacts land on a single, permanently-named `nightly` prerelease that is
# replaced on every push. Alongside the wheels it carries `version.json`, a tiny
# manifest the app reads to answer "is there something newer than me?" in one
# request (see precursor/backend/services/updates.py).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    name: Build and publish the rolling build
    runs-on: ubuntu-latest
    permissions:
      contents: write # replace the `nightly` release and its assets
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so hatch-vcs derives a dev version that encodes
          # the commit (…dev227+g<sha>), which is what the update check compares.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (bundled into the wheel)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build plugin frontends
        run: make plugins-build

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build wheels + sdists
        run: uv build --all-packages

      - name: Write the version manifest
        id: manifest
        run: |
          set -euo pipefail
          host_wheel=$(ls dist/precursor_ai-*.whl | head -n1)
          version=$(basename "$host_wheel" | sed -E 's#^precursor_ai-([^-]+)-.*#\1#')
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly"
          # Plugin wheels ride along so a nightly install gets nightly plugins
          # rather than whatever is on PyPI (see `--with` in services/updates.py).
          extras=$(ls dist/*.whl \
            | grep -v '^dist/precursor_ai-' \
            | while read -r w; do echo "\"$base/$(basename "$w")\""; done \
            | paste -sd, -)
          cat > dist/version.json <<EOF
          {
            "channel": "nightly",
            "version": "$version",
            "commit": "${GITHUB_SHA:0:9}",
            "full_commit": "${GITHUB_SHA}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "wheel_url": "$base/$(basename "$host_wheel")",
            "extra_wheel_urls": [${extras}]
          }
          EOF
          cat dist/version.json
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail
          # Written to a file rather than passed inline: the notes contain
          # backticks and fenced blocks, which are a shell-quoting minefield.
          cat > notes.md <<EOF
          Rolling build of \`main\` (${GITHUB_SHA:0:9}).

          > [!WARNING]
          > This is an unstable prerelease rebuilt on every push. Use a tagged
          > release if you want stability.

          Install (or update) in one command:

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install.sh | sh
          \`\`\`

          An existing install updates itself with \`precursor service update\`.
          EOF
          # Delete-then-create (rather than editing) so the tag moves to this
          # commit and no stale wheel from a previous run is left behind for a
          # client to resolve.
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly \
            --title "Nightly ($VERSION)" \
            --notes-file notes.md \
            --prerelease \
            --target "$GITHUB_SHA" \
            dist/*.whl dist/*.tar.gz dist/version.json
