name: Release

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan and check CI only; do not build, tag or publish"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  UV_FROZEN: "1"

# All stable releases share a lock, including manual tags and retries.
concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  plan:
    name: Select a green, unreleased main revision
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      automation_sha: ${{ steps.plan.outputs.automation_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Plan the release and require CI on its exact SHA
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: python3 scripts/release.py plan --tag "$MANUAL_TAG"

      - name: Report dry run
        if: inputs.dry_run
        run: echo "Dry run only; nothing will be tagged or published." >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and stage immutable artifacts
    needs: plan
    if: needs.plan.outputs.publish == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      # Keep orchestration separate from the candidate checkout: a retry may
      # build a historical revision, but must use this run's release helpers.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.automation_sha }}
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Recover previously staged artifacts on retry
        id: recover
        run: python3 scripts/release.py recover --tag "$TAG" --sha "$SHA" --dist release-source/dist

      - name: Set up Node
        if: steps.recover.outputs.restored != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            release-source/frontend/package-lock.json
            release-source/website/package-lock.json

      - name: Build frontend and bundled documentation
        if: steps.recover.outputs.restored != 'true'
        working-directory: release-source
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          npm --prefix website ci
          DOCS_BASE=/docs/ npm --prefix website run docs:build

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build the exact tagged version locally
        if: steps.recover.outputs.restored != 'true'
        working-directory: release-source
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$SHA"
          else
            git tag "$TAG" "$SHA"
          fi
          uv build --no-create-gitignore

      - name: Exercise a fresh wheel installation outside the checkout
        run: |
          set -euo pipefail
          uv venv --python 3.12 "$RUNNER_TEMP/release-venv"
          uv pip install --python "$RUNNER_TEMP/release-venv/bin/python" release-source/dist/*.whl
          uv pip check --python "$RUNNER_TEMP/release-venv/bin/python"
          "$RUNNER_TEMP/release-venv/bin/python" -I scripts/smoke_release.py "${TAG#v}"

      # GITHUB_TOKEN-created tags do not trigger push workflows. This run
      # continues directly to publishing, without a PAT or recursive workflow.
      - name: Reserve the tag and stage a draft GitHub Release
        env:
          PREVIOUS_TAG: ${{ needs.plan.outputs.previous_tag }}
        run: |
          python3 scripts/release.py stage --tag "$TAG" --sha "$SHA" \
            --previous-tag "$PREVIOUS_TAG" --dist release-source/dist

      - name: Upload staged artifacts for publishing
        uses: actions/upload-artifact@v7
        with:
          name: stable-dist
          path: release-source/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI, then make the GitHub Release latest
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/precursor-ai
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.automation_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: stable-dist
          path: dist

      - name: Reconcile PyPI with the immutable staged artifacts
        id: pypi
        run: python3 scripts/release.py pypi --tag "$TAG" --sha "$SHA"

      - name: Publish missing files to PyPI
        if: steps.pypi.outputs.pending == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish-dist/

      - name: Confirm PyPI artifacts and publish the GitHub Release
        run: python3 scripts/release.py finish --tag "$TAG" --sha "$SHA"
