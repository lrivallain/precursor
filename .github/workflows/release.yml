name: Release

# Publish a release when a CalVer tag is pushed, e.g. `v2026.6.0`.
# The version is derived from the tag by hatch-vcs at build time.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so hatch-vcs resolves the exact tagged version.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (bundled into the wheel)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Each in-repo plugin's UI is built into its own Python package, so it
      # ships inside that plugin's wheel and Precursor can serve it. Without
      # this a released plugin would have a backend but no interface.
      - name: Build plugin frontends
        run: make plugins-build

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build wheel + sdist
        # `--all-packages`, not a bare `uv build`: the workspace also holds the
        # built-in plugins, and a release that ships the host without them
        # leaves `precursor-ai[kanban]` unresolvable on PyPI.
        run: uv build --all-packages

      - name: Verify built versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # Built-in plugins inherit the host's CalVer from the same git tag, so
          # every wheel in dist/ must carry it — a mismatch means one of them
          # resolved its version from somewhere else.
          status=0
          for whl in dist/*.whl; do
            name=$(basename "$whl")
            built=$(echo "$name" | sed -E 's#^[^-]+-([^-]+)-.*#\1#')
            echo "$name -> $built"
            # Normalise PEP 440 (CalVer maps 1:1, so they should match exactly).
            if [ "$tag" != "$built" ]; then
              echo "::error::$name does not match the tag ($tag)"
              status=1
            fi
          done
          exit $status

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release + upload assets
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Auto-generate notes from merged PRs / conventional commits since the
          # previous tag.
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz

  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # A dedicated environment lets you scope the trusted publisher (and optional
    # required reviewers) to releases. Configure the matching publisher on PyPI:
    # https://docs.pypi.org/trusted-publishers/adding-a-publisher/
    #
    # This step uploads every wheel in dist/, which now includes the built-in
    # plugins — so PyPI needs a trusted publisher for **each** distribution
    # (`precursor-ai` and `precursor-kanban`), pointing at this same workflow.
    # Without the second one the upload fails on the plugin.
    environment:
      name: pypi
      url: https://pypi.org/p/precursor-ai
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing (no API token needed)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
