name: Relock

# Lockfiles are regenerated here, never on a contributor's machine: corporate
# package mirrors rewrite artifact URLs and downgrade the integrity metadata
# (npm sha512 -> sha1, and uv loses size/upload-time). GitHub's runners reach
# the public registries, so they are the only trustworthy place to resolve.

on:
  workflow_dispatch:
    inputs:
      targets:
        description: Which lockfiles to regenerate
        type: choice
        default: all
        options: [all, python, frontend, website]
      upgrade:
        description: "Python only: let versions move within their declared ranges (npm always re-resolves)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: relock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  relock:
    name: Regenerate lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so hatch-vcs can resolve the CalVer version.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Regenerate uv.lock
        if: inputs.targets == 'all' || inputs.targets == 'python'
        run: uv lock ${{ inputs.upgrade && '--upgrade' || '' }}

      # npm keeps any lock entry that still satisfies its range — including the
      # proxied URL and its sha1 — so `--package-lock-only` alone cannot clean a
      # polluted lockfile. Deleting it first forces a full re-resolution, which
      # also means versions settle at the newest release inside their declared
      # ranges. The build/typecheck steps below are what make that safe.
      - name: Regenerate frontend/package-lock.json
        if: inputs.targets == 'all' || inputs.targets == 'frontend'
        run: |
          rm -f package-lock.json
          npm install --package-lock-only
        working-directory: frontend

      - name: Regenerate website/package-lock.json
        if: inputs.targets == 'all' || inputs.targets == 'website'
        run: |
          rm -f package-lock.json
          npm install --package-lock-only
        working-directory: website

      - name: Verify the lockfiles are clean
        run: python3 scripts/check_lockfiles.py

      # A regenerated lockfile that cannot install is worse than a dirty one.
      - name: Verify the Python lockfile installs
        if: inputs.targets == 'all' || inputs.targets == 'python'
        run: uv sync --locked

      - name: Verify the frontend lockfile builds
        if: inputs.targets == 'all' || inputs.targets == 'frontend'
        run: npm ci && npm run typecheck && npm run build
        working-directory: frontend

      - name: Verify the website lockfile builds
        if: inputs.targets == 'all' || inputs.targets == 'website'
        run: npm ci && npm run docs:build
        working-directory: website

      - name: Report the result
        id: diff
        run: |
          if git diff --quiet -- uv.lock frontend/package-lock.json website/package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Lockfiles were already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- uv.lock frontend/package-lock.json website/package-lock.json
          fi

      # Feature branches get the fix pushed straight back so the contributor can
      # keep working; the default branch always goes through review.
      - name: Push to the branch
        if: steps.diff.outputs.changed == 'true' && github.ref_name != github.event.repository.default_branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock frontend/package-lock.json website/package-lock.json
          git commit -m "chore(deps): regenerate lockfiles on a clean network"
          git push origin HEAD:"$GITHUB_REF_NAME"

      - name: Open a pull request
        if: steps.diff.outputs.changed == 'true' && github.ref_name == github.event.repository.default_branch
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/relock
          title: "chore(deps): regenerate lockfiles on a clean network"
          commit-message: "chore(deps): regenerate lockfiles on a clean network"
          body: |
            Regenerated by the `Relock` workflow so every artifact is pinned to
            a public URL with a strong hash.

            - targets: `${{ inputs.targets }}`
            - upgrade: `${{ inputs.upgrade }}`
          labels: dependencies
